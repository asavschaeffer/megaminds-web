name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validate models
        run: npm run lint:models -- --strict

      - name: Check report citations
        run: npm run lint:citations

      - name: Check report freshness
        run: npm run lint:freshness

      - name: Check abbreviation usage
        run: npm run lint:abbr
